name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          PROJECT_REF=hlfufjrjztuknioydlut
          FUNCTIONS=(
            integrations-zoom-calendly
            sync-live-session-pipeline
            live-session-auto-assessment
            live-session-registrants
            integrations-webinar-geek
            webinar-geek-questionnaire-webhook
            google-form-questionnaire-webhook
            send-email
            send-candidate-email
            live-session-calendar
            send-assessment-email
            assessment-lookup
            send-leadership-assessment-reminders
            performance-check-in-reminder
            upload-resume
            hr-dashboard-data
            hr-rollup-jobs
            hr-automation-runner
            email-inbox-sync
            staff-notifications
            coaching-hub-data
            dashboard-team-metrics
            ops-console
            support-tickets
            threecx-call-control
            threecx-call-webhook
            threecx-call-admin
            sync-live-session-outcomes
            pipeline-candidate-emails
            sync-recruiter-coins
            pipeline-convert-resume
            pipeline-hr-leads
            send-weekly-leaderboard-email
          )
          for fn in "${FUNCTIONS[@]}"; do
            if [ -f "supabase/functions/$fn/index.ts" ]; then
              echo "Deploying $fn ..."
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            fi
          done
